{{ define "entity_pills" }}
<div class="flex flex-wrap gap-2 py-1">
  {{ if eq .Entity "rooms" }}
    {{ range .Rooms }}
    <button
      hx-get="/planing/{{ $.TaskID }}/schedule/room/{{ .ID }}"
      hx-target="#entity-grid-room"
      hx-swap="innerHTML"
      class="pill-btn pill"
      onclick="this.closest('[id^=entity-list]').querySelectorAll('.pill-btn').forEach(b=>b.classList.remove('pill-active')); this.classList.add('pill-active')">
      <svg class="mr-1.5 icon-sm text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      {{ .Name }}
      {{ if gt .ConflictCount 0 }}
      <span class="badge-count" title="{{ .ConflictCount }} conflicto(s)">
        {{ .ConflictCount }}
      </span>
      {{ end }}
    </button>
    {{ end }}
  {{ else if eq .Entity "teachers" }}
    {{ range .Teachers }}
    <button
      hx-get="/planing/{{ $.TaskID }}/schedule/teacher/{{ .ID }}"
      hx-target="#entity-grid-teacher"
      hx-swap="innerHTML"
      class="pill-btn pill"
      onclick="this.closest('[id^=entity-list]').querySelectorAll('.pill-btn').forEach(b=>b.classList.remove('pill-active')); this.classList.add('pill-active')">
      <svg class="mr-1.5 icon-sm text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      {{ .Name }}
      {{ if gt .ConflictCount 0 }}
      <span class="badge-count" title="{{ .ConflictCount }} conflicto(s)">
        {{ .ConflictCount }}
      </span>
      {{ end }}
    </button>
    {{ end }}
  {{ else if eq .Entity "groups" }}
    {{ range .Groups }}
    {{ if isNil .ParentID }}
    <button
      hx-get="/planing/{{ $.TaskID }}/schedule/group/{{ .ID }}"
      hx-target="#entity-grid-group"
      hx-swap="innerHTML"
      class="pill-btn pill"
      onclick="this.closest('[id^=entity-list]').querySelectorAll('.pill-btn').forEach(b=>b.classList.remove('pill-active')); this.classList.add('pill-active')">
      <svg class="mr-1.5 icon-sm text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      {{ .Name }}
      {{ if gt .ConflictCount 0 }}
      <span class="badge-count" title="{{ .ConflictCount }} conflicto(s)">
        {{ .ConflictCount }}
      </span>
      {{ end }}
    </button>
    {{ end }}
    {{ end }}
  {{ end }}
</div>
{{ end }}
