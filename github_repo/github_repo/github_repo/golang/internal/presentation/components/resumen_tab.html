{{ define "resumen_tab" }}
<div class="space-y-6" x-data="{ analyzeOpenRows: {} }">

  <!-- Tarjetas de Resumen -->
  <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mt-6">
    {{ template "stats_cards" dict "Stats" .Stats "Percent" .Percent "IsPolling" false }}
  </div>

  <!-- Gráfico de Evolución Hard (Alpine.js + Chart.js) -->
  <div class="mt-6 bg-white p-4 rounded-xl shadow-sm border border-outline-variant/30"
       x-data="hardChart('{{ .TaskID }}')"
       @update-status.window="fetchData()">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold text-gray-800">Evolución Hard (Conflictos y Puntaje)</h3>

    </div>
    <div class="relative h-64 w-full">
      <canvas></canvas>
    </div>
  </div>

  <!-- Gráfico de Evolución Soft (Alpine.js + Chart.js) -->
  <div class="mt-6 bg-white p-4 rounded-xl shadow-sm border border-outline-variant/30"
       x-data="softChart('{{ .TaskID }}')"
       @update-status.window="fetchData()">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-sm font-bold text-gray-800">Evolución Soft (Conflictos y Puntaje)</h3>
    </div>
    <div class="relative w-full h-64">
      <canvas></canvas>
    </div>
  </div>
  <div hx-get="/analyze/{{ .TaskID }}" hx-trigger="intersect once, refreshgrid from:body" hx-swap="outerHTML">
    <div class="py-10 text-center text-sm text-gray-400">Cargando análisis…</div>
  </div>
</div>
{{ end }}
