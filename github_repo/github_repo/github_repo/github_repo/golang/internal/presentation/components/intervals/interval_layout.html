{{ define "interval_layout" }}
<div x-data="{ intervalTab: 'list' }" class="bg-surface-container-lowest border border-outline-variant/20 shadow-sm rounded-xl p-md overflow-x-auto relative w-full" id="interval-module-container">
  <div class="flex flex-col gap-lg">
    


    <!-- Pestañas (Tabs) -->
    <div class="flex items-center justify-between border-b border-outline-variant/30 pb-3">
      <div class="flex items-center gap-2">
         <button @click="intervalTab = 'list'" 
                 :class="intervalTab === 'list' ? 'bg-primary/10 text-primary font-bold' : 'text-on-surface-variant hover:bg-surface-variant font-semibold'"
                 class="px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">table_rows</span>
            Listado
         </button>
         <button @click="intervalTab = 'ocupabilidad'" 
                 :class="intervalTab === 'ocupabilidad' ? 'bg-primary/10 text-primary font-bold' : 'text-on-surface-variant hover:bg-surface-variant font-semibold'"
                 class="px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">insert_chart</span>
            Ocupabilidad
         </button>
         <button @click="intervalTab = 'schedule'" 
                 :class="intervalTab === 'schedule' ? 'bg-primary/10 text-primary font-bold' : 'text-on-surface-variant hover:bg-surface-variant font-semibold'"
                 class="px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">calendar_month</span>
            Horario
         </button>
      </div>
    </div>

    <!-- Contenido Tabs -->
    <div class="relative min-h-[400px]">
      
      <!-- Tab: Listado -->
      <div x-show="intervalTab === 'list'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100">
        {{ template "interval_list" . }}
      </div>
      
      <!-- Tab: Ocupabilidad -->
      <div x-show="intervalTab === 'ocupabilidad'" style="display: none;" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100">
        <div class="flex justify-end mb-3 mt-1">
           <div x-data="{ time: new Date().toLocaleTimeString() }" class="inline-flex items-center gap-1.5 rounded-md bg-primary/10 px-2 py-1 text-xs font-medium text-primary shadow-sm" title="Actualizado a esta hora (Usa el botón Recargar Tablas para forzar actualización)">
             <svg class="h-3.5 w-3.5 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
             </svg>
             <span x-text="'Actualizado: ' + time"></span>
           </div>
        </div>
        <div id="ocupabilidad-container" hx-get="/planing/{{ .TaskID }}/ocupabilidad" hx-trigger="load, refreshgrid from:body" hx-swap="innerHTML">
          <div class="py-10 text-center text-sm text-gray-400 animate-pulse">Cargando ocupabilidad…</div>
        </div>
      </div>
      
      <!-- Tab: Schedule -->
      <div x-show="intervalTab === 'schedule'" style="display: none;" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100">

        <div class="border border-outline-variant/30 rounded-xl overflow-hidden bg-surface-container-lowest shadow-sm" id="interval-schedule-section">
          <div class="px-md py-sm bg-surface-container-low border-b border-outline-variant/30 flex items-center justify-between gap-sm">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center">
                <span class="material-symbols-outlined">calendar_month</span>
              </div>
              <div>
                <h3 class="text-label-md font-label-md font-bold text-on-surface flex items-center gap-2">
                  <span id="calendar-active-interval-name">Seleccione un bloque horario de la lista</span>
                </h3>
              </div>
            </div>
          </div>
          <div class="p-4" id="interval-schedule-target">
            <div class="rounded-xl border-2 border-dashed border-gray-200 py-12 text-center text-sm text-gray-400">
              Selecciona un bloque horario de la tabla para ver las sesiones asignadas.
            </div>
          </div>
        </div>
      </div>
      
    </div>
</div>
{{ end }}
