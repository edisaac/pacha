# Quarkus configuration
quarkus.http.port=8082
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# Timefold Solver configuration
quarkus.timefold.solver.termination.spent-limit=600s
quarkus.timefold.solver.termination.unimproved-spent-limit=120s
quarkus.timefold.solver.environment-mode=NON_REPRODUCIBLE

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."ai.timefold.solver".level=INFO
quarkus.log.category."com.timeflod".level=DEBUG


# Scheduler configuration
quarkus.scheduler.enabled=true

# OpenAPI configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

quarkus.timefold.solver.score-calculator-class=com.timeflod.schooltimetabling.solver.TimeTableIncrementalScoreCalculator
