name: Reporte de Error (Bug)
description: Reporta un fallo en el solver o la interfaz de usuario
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: os
    attributes:
      label: Sistema Operativo
      description: ¿En qué sistema operativo ocurre el error?
      placeholder: Ej. Windows 11, Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la Aplicación
      description: ¿Qué versión estás utilizando? (Ej. v0.1.0-beta)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Describe los pasos exactos para reproducir el error.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Capturas de Pantalla
      description: Arrastra y suelta (o pega) capturas de pantalla de la interfaz o el error para ayudarnos a entender el problema.
  - type: textarea
    id: logs
    attributes:
      label: Logs o Score devuelto
      description: Pega aquí los logs de la consola o el score devuelto por el solver si aplica.
      render: shell
